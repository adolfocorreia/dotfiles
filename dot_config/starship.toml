# Add non-breaking space as the last character in prompt
# (used for searching last command in tmux)
format = "$all "

right_format = "${custom.date}"

[conda]
ignore_base = false

[direnv]
disabled = false

[custom.date]
command = """ date +"[%H:%M:%S]" """
when = "true"
description = "The current time stamp"
os = "unix"

[status]
disabled = false
format = "[$common_meaning$signal_name $hex_status]($style) "
